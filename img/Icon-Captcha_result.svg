<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="activeBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.15" />
    </filter>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Cyber Mesh Ambient Lighting -->
  <circle cx="200" cy="150" r="320" fill="#6366f1" opacity="0.18" filter="blur(60px)" />
  <circle cx="1000" cy="500" r="300" fill="#ec4899" opacity="0.12" filter="blur(60px)" />
  <circle cx="600" cy="350" r="280" fill="#38bdf8" opacity="0.10" filter="blur(50px)" />

  <!-- Grid lines for high-tech backdrop -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Floating Badge: Top Left -->
  <g transform="translate(180, 50)">
    <rect width="280" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="42" y="27" fill="#f8fafc" font-family="Vazirmatn, system-ui, sans-serif" font-size="14" font-weight="700" direction="rtl">چالش تطبیق آیکون ۳ بعدی گاردفای</text>
  </g>

  <!-- Floating Shield Icon: Top Right -->
  <g transform="translate(970, 50)">
    <rect width="48" height="42" rx="14" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1" />
    <text x="24" y="28" fill="#a5b4fc" font-size="20" text-anchor="middle">🛡️</text>
  </g>

  <!-- Main Captcha Card Mockup Container (Exact Screenshot match) -->
  <g transform="translate(160, 115)" filter="url(#cardShadow)">
    <!-- Outer Card Background -->
    <rect width="880" height="450" rx="28" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Top Subtle Divider Line -->
    <line x1="30" y1="65" x2="850" y2="65" stroke="#f1f5f9" stroke-width="2" />

    <!-- Refresh Question Icon & Text (Left side in RTL) -->
    <g transform="translate(45, 120)" cursor="pointer">
      <circle cx="16" cy="10" r="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
      <path d="M12 6 A 6 6 0 1 1 10 12" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      <polyline points="9,6 12,6 12,9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="40" y="16" fill="#64748b" font-family="Vazirmatn, system-ui, sans-serif" font-size="15" font-weight="700" direction="rtl">تغییر سوال</text>
    </g>

    <!-- Main Question Prompt (Right side in RTL) -->
    <text x="835" y="136" fill="#0f172a" font-family="Vazirmatn, system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="start" direction="rtl">
      روی آیکون <tspan fill="#4f46e5">«کلید دسترسی»</tspan> کلیک و دکمه بررسی را بزنید:
    </text>

    <!-- 4 Option Boxes Grid -->
    <!-- Box 1: Heart ❤️ -->
    <g transform="translate(45, 185)" filter="url(#boxShadow)">
      <rect width="185" height="135" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- 3D Heart Art -->
      <g transform="translate(92, 68)">
        <path d="M0 18 C -24 0, -32 -20, -14 -32 C 0 -38, 0 -22, 0 -14 C 0 -22, 0 -38, 14 -32 C 32 -20, 24 0, 0 18 Z" fill="#f43f5e" />
        <ellipse cx="-6" cy="-22" rx="4" ry="7" fill="#fda4af" opacity="0.7" transform="rotate(-30, -6, -22)" />
      </g>
    </g>

    <!-- Box 2: Cloud ☁️ -->
    <g transform="translate(245, 185)" filter="url(#boxShadow)">
      <rect width="185" height="135" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- 3D Cloud Art -->
      <g transform="translate(92, 68)">
        <ellipse cx="0" cy="4" rx="28" ry="16" fill="#e2e8f0" />
        <circle cx="-12" cy="-4" r="16" fill="#f1f5f9" />
        <circle cx="10" cy="-6" r="14" fill="#ffffff" />
        <ellipse cx="-5" cy="-8" rx="8" ry="5" fill="#ffffff" opacity="0.9" />
      </g>
    </g>

    <!-- Box 3: Key 🔑 (Selected Target Item) -->
    <g transform="translate(445, 185)" filter="url(#boxShadow)">
      <rect width="185" height="135" rx="20" fill="url(#activeBoxGrad)" stroke="#c7d2fe" stroke-width="2" />
      <!-- 3D Gold Key Art -->
      <g transform="translate(92, 68)">
        <circle cx="-14" cy="-14" r="14" fill="url(#goldGrad)" />
        <circle cx="-14" cy="-14" r="6" fill="#eef2ff" />
        <rect x="-4" y="-3" width="36" height="7" rx="3.5" fill="url(#goldGrad)" transform="rotate(45, 14, 0)" />
        <rect x="18" y="-1" width="5" height="8" rx="2" fill="#d97706" transform="rotate(45, 14, 0)" />
        <rect x="28" y="-1" width="5" height="6" rx="2" fill="#d97706" transform="rotate(45, 14, 0)" />
        <circle cx="-16" cy="-17" r="3" fill="#fef08a" opacity="0.9" />
      </g>
    </g>

    <!-- Box 4: Bell 🔔 -->
    <g transform="translate(645, 185)" filter="url(#boxShadow)">
      <rect width="185" height="135" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- 3D Gold Bell Art -->
      <g transform="translate(92, 68)">
        <path d="M-18 12 C -18 -6, -14 -22, 0 -22 C 14 -22, 18 -6, 18 12 Z" fill="url(#goldGrad)" />
        <ellipse cx="0" cy="12" rx="20" ry="4" fill="#d97706" />
        <circle cx="0" cy="-24" r="3.5" fill="#fef08a" />
        <circle cx="0" cy="14" r="4" fill="#b45309" />
        <ellipse cx="-6" cy="-6" rx="3" ry="8" fill="#fef08a" opacity="0.8" />
      </g>
    </g>

    <!-- Full Width Submit Action Button (Exact match) -->
    <g transform="translate(45, 345)" filter="url(#btnShadow)" cursor="pointer">
      <rect width="785" height="64" rx="18" fill="url(#btnGrad)" stroke="#475569" stroke-width="1" />
      <text x="392" y="40" fill="#ffffff" font-family="Vazirmatn, system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">
        بررسی
      </text>
    </g>
  </g>

  <!-- Bottom Subtitle / Branding Note -->
  <text x="600" y="625" fill="rgba(255,255,255,0.45)" font-family="Vazirmatn, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" direction="rtl">
    نمونه ویجت کپچای اختصاصی تشخیص آیکون تصویری گاردفای پرو (Guardify Pro v4.00)
  </text>
</svg>
